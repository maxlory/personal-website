name: Refresh Tokscale snapshot

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate snapshot
        run: node scripts/update-tokscale-snapshot.mjs
      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- src/lib/tokscale/snapshot.json; then
            echo "Tokscale snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tokscale/snapshot.json
          git commit -m "chore: refresh Tokscale snapshot"
          git push
